name: hoster-dist
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hoster-dist
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install
      - run: cd packages/web && bun run build
      - name: Publish dist to hoster-dist
        run: |
          cd packages/web/dist
          cp ../public/.htaccess .htaccess
          git init -q -b hoster-dist
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hoster-dist:hoster-dist
